# 蛋白质荧光图像分析 — 通道与路径配置
# 由 analyze_protein.py / segment_nuclei.py / make_sample_data.py 共同读取

# 数据布局（相对本文件所在目录）
image_dir: protein_data/images          # 多通道荧光 TIFF（下载或自行放入）

# 产出目录：segment_nuclei.py 分割出的实例 mask 与 analyze_protein.py 的定量 CSV
# 统一收在这里，与代码（*.py 与 protein.yaml）和原始数据（protein_data*）分开。
# 跑合成演示数据时用 --out_dir outputs_synth，避免覆盖真实数据的结果。
output_dir: outputs

# 通道索引（按你的显微镜通道顺序调整）
# 真实数据（download_protein.py）只有两个通道：Hoechst 核 + CellMask 胞质，
# 因此 protein_b 为 null，共定位字段不输出；
# 若要跑合成演示数据的共定位（make_sample_data.py 生成 3 通道），把它改成 2，
# 并用 --data_dir protein_data_synth 指向合成数据。
channels:
  nucleus: 0      # 核染色 DAPI / Hoechst
  protein_a: 1    # 目标蛋白 A（真实数据为 CellMask 胞质/膜染料）
  protein_b: null # 共定位蛋白 B（null = 该数据没有第二个蛋白通道）

# 分析参数
background_percentile: 5   # 用该分位作为背景基线并从强度中扣除
manders_percentile: 50     # Manders 系数里判定「蛋白 B 高表达区」的分位
